# CI gate (docs/03-ARCHITECTURE.md §6): fmt, clippy, tests, content
# validation. A red main is an emergency.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on PR branches; let main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy 0.18's default features need ALSA + udev headers AND the
      # Wayland client libs at compile time (wayland-sys links the system
      # library; the runner image does not ship the -dev packages).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

      # Installs the channel + components pinned in rust-toolchain.toml.
      # (`rustup show` stopped syncing as a side effect in rustup 1.28.)
      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          # Bevy's cold build is expensive; keep partial caches from red runs.
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all --check

      # --locked everywhere: the committed Cargo.lock is the version pin
      # (golden rule 3); silent re-resolution would test unpinned versions.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Validate content
        run: cargo run -p tools --locked -- validate

  wiki-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Wiki data matches content (single source of truth)
        run: |
          cargo run -p tools -- wiki
          git diff --exit-code wiki/src/data

  pack-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate P8 — the Skalden pack touches only content/ + assets/
        run: scripts/check-pack-purity.sh skalden-pack-start-v2 skalden-pack-end
